<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unlock your surprise! — Sathya's Birthday</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
  <link rel="icon" type="image/webp" href="assets/favicon/favicon.webp">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">

  <!-- Google Typography: Vintage cursive handwriting & elegant warm serif -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Dancing+Script:wght@600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/secret-code.css">
</head>
<body class="secret-code-body">

  <!-- Scrapbook Background Image Layer (Desktop & Mobile via media queries) -->
  <div class="secret-code-bg-layer" aria-hidden="true"></div>

  <!-- Ambient Floating Scrapbook Particles (Hearts & Sparkles) -->
  <div class="secret-code-ambient-particles" aria-hidden="true">
    <span class="secret-code-ambient-heart ah-1">♡</span>
    <span class="secret-code-ambient-heart ah-2">❤</span>
    <span class="secret-code-ambient-heart ah-3">♡</span>
    <span class="secret-code-ambient-heart ah-4">❤</span>
    <span class="secret-code-ambient-star as-1">✦</span>
    <span class="secret-code-ambient-star as-2">✨</span>
    <span class="secret-code-ambient-star as-3">✦</span>
    <span class="secret-code-ambient-star as-4">⋆</span>
  </div>

  <main class="secret-code-main">
    <div class="secret-code-container">

      <!-- Birthday Cats Sticker atop card: Standing cats (initial) & Dancing cats (celebration) -->
      <div class="secret-code-kitten-wrap" id="secret-code-kitten-wrap" aria-hidden="true">
        <div class="secret-code-kitten-hearts">
          <span class="secret-code-celeb-heart">♡</span>
          <span class="secret-code-celeb-heart">✨</span>
          <span class="secret-code-celeb-heart">♡</span>
          <span class="secret-code-celeb-heart">✦</span>
        </div>
        <div class="secret-code-cats-container">
          <img 
            src="assets/characters/standing-cats.webp" 
            alt="Two birthday cats standing upright in sunglasses, party hats and bow ties" 
            class="secret-code-cat-img secret-code-cat-standing"
            id="secret-code-cat-standing"
            draggable="false"
          />
          <img 
            src="assets/characters/dancing-cats.webp" 
            alt="Two birthday cats dancing in celebration with sunglasses and party hats" 
            class="secret-code-cat-img secret-code-cat-dancing"
            id="secret-code-cat-dancing"
            draggable="false"
          />
        </div>
      </div>

      <!-- Cream Torn-Paper Password Card -->
      <article class="secret-code-card" id="secret-code-card" aria-label="Secret code entry card">
        
        <!-- Washi Tape Strips on Top Corners -->
        <div class="secret-code-tape secret-code-tape-left" aria-hidden="true"></div>
        <div class="secret-code-tape secret-code-tape-right" aria-hidden="true"></div>

        <!-- Mini Polaroid Locked Card with Bronze Paperclip on Right -->
        <div class="secret-code-polaroid-badge" aria-hidden="true">
          <img src="assets/lock-polaroid.webp" alt="" class="secret-code-polaroid-img" draggable="false" />
        </div>

        <!-- Hand-drawn Doodle Hearts -->
        <span class="secret-code-doodle-heart dh-1" aria-hidden="true">♡</span>
        <span class="secret-code-doodle-heart dh-2" aria-hidden="true">♡</span>
        <span class="secret-code-doodle-heart dh-3" aria-hidden="true">♡</span>
        <span class="secret-code-doodle-heart dh-4" aria-hidden="true">♡</span>

        <!-- Radiant Accent Marks next to Slots -->
        <span class="secret-code-radiant-left" aria-hidden="true">彡</span>
        <span class="secret-code-radiant-right" aria-hidden="true">ミ</span>

        <!-- Small Heading on washi tape strip -->
        <div class="secret-code-banner-wrap">
          <span class="secret-code-small-heading">A LITTLE SECRET FOR YOU...</span>
        </div>

        <!-- Main Heading: "Unlock your surprise!" -->
        <div class="secret-code-heading-wrap">
          <h1 class="secret-code-main-heading">Unlock your surprise!</h1>
          <div class="secret-code-heading-flourish" aria-hidden="true"></div>
        </div>

        <!-- Subtitle & Live Status Feedback -->
        <p class="secret-code-subtitle" id="secret-code-subtitle" role="status" aria-live="polite">
          Hmm... only someone special knows this secret.
        </p>

        <!-- Input Heading -->
        <h2 class="secret-code-input-heading">Enter your secret code</h2>

        <!-- Exactly Six Digit Positions (Dots displayed) -->
        <div class="secret-code-slots-row" id="secret-code-slots" role="group" aria-label="6 digit passcode display">
          <div class="secret-code-slot" aria-label="Digit 1 empty"><span class="secret-code-slot-dot"></span></div>
          <div class="secret-code-slot" aria-label="Digit 2 empty"><span class="secret-code-slot-dot"></span></div>
          <div class="secret-code-slot" aria-label="Digit 3 empty"><span class="secret-code-slot-dot"></span></div>
          <div class="secret-code-slot" aria-label="Digit 4 empty"><span class="secret-code-slot-dot"></span></div>
          <div class="secret-code-slot" aria-label="Digit 5 empty"><span class="secret-code-slot-dot"></span></div>
          <div class="secret-code-slot" aria-label="Digit 6 empty"><span class="secret-code-slot-dot"></span></div>
        </div>

        <!-- Custom 6-Digit Numeric Keypad (12 buttons: 1-9, Backspace, 0, Submit) -->
        <div class="secret-code-keypad" id="secret-code-keypad" role="group" aria-label="Numeric keypad">
          <button class="secret-code-btn" type="button" data-digit="1" aria-label="1">1</button>
          <button class="secret-code-btn" type="button" data-digit="2" aria-label="2">2</button>
          <button class="secret-code-btn" type="button" data-digit="3" aria-label="3">3</button>
          <button class="secret-code-btn" type="button" data-digit="4" aria-label="4">4</button>
          <button class="secret-code-btn" type="button" data-digit="5" aria-label="5">5</button>
          <button class="secret-code-btn" type="button" data-digit="6" aria-label="6">6</button>
          <button class="secret-code-btn" type="button" data-digit="7" aria-label="7">7</button>
          <button class="secret-code-btn" type="button" data-digit="8" aria-label="8">8</button>
          <button class="secret-code-btn" type="button" data-digit="9" aria-label="9">9</button>
          
          <!-- Backspace Button (⌫) -->
          <button class="secret-code-btn secret-code-btn-backspace" type="button" data-action="backspace" aria-label="Backspace">
            <svg class="secret-code-backspace-svg" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"/>
            </svg>
          </button>

          <!-- Zero Button (0) -->
          <button class="secret-code-btn" type="button" data-digit="0" aria-label="0">0</button>

          <!-- Submit Checkmark Button (✓) with crimson styling -->
          <button class="secret-code-btn secret-code-btn-submit" type="button" data-action="submit" aria-label="Unlock surprise">
            <span class="secret-code-submit-icon" aria-hidden="true">&#10003;</span>
          </button>
        </div>

        <!-- Golden Unlocked Badge (Revealed on correct password) -->
        <div class="secret-code-unlocked-badge" id="secret-code-unlocked-badge" aria-hidden="true">
          <span>✨</span> SURPRISE UNLOCKED! <span>✨</span>
        </div>

        <!-- Supporting text at bottom of card -->
        <p class="secret-code-supporting-text">A little secret, just between us ♡</p>

      </article>

    </div>
  </main>

  <!-- Celebration Confetti and Hearts Particle Container -->
  <div class="secret-code-confetti-container" id="secret-code-confetti" aria-hidden="true"></div>

  <!-- Section 02 Functionality Script -->
  <script src="js/secret-code.js"></script>
</body>
</html>
